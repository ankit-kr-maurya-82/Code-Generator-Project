<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">AI</span>
                <div class="brand-copy">
                    <strong>Code Generator</strong>
                   
                </div>
            </div>
            <div class="topbar-actions">
                <button id="historyToggle" class="topbar-button" type="button" aria-expanded="false" aria-controls="historyPanel">History</button>
                {#<span class="provider-pill">CodeGen</span>#}
            </div>
        </header>

        <aside class="history-panel" id="historyPanel" aria-label="Generation history" hidden>
            <div class="history-header">
                <div>
                    <h2>History</h2>
                    <span class="history-count">Saved items: <strong id="historyCount">0</strong></span>
                </div>
                <button id="clearHistoryBtn" class="ghost-button" type="button">Clear</button>
            </div>
            <div class="history-empty" id="historyEmpty">No saved generations yet.</div>
            <div class="history-list" id="historyList"></div>
        </aside>

        <section class="chat-thread" id="chatThread" aria-live="polite">
            <div class="empty-state" id="emptyState">
                <section class="welcome" aria-labelledby="page-title">
                    <h1 id="page-title"><span>Hello, developer.</span> What should we build?</h1>
                </section>

                <section class="suggestions" aria-label="Example prompts">
                    <button type="button" class="chip" data-prompt="Create a responsive React pricing card with monthly and annual billing states.">Create a React pricing card</button>
                    <button type="button" class="chip" data-prompt="Write a Python script that reads a CSV, cleans missing values, and exports a summary report.">Write a CSV cleanup script</button>
                    <button type="button" class="chip" data-prompt="Design a REST API schema for a task manager with auth, projects, labels, and comments.">Design a task manager API</button>
                    <button type="button" class="chip" data-prompt="Explain this error in simple words and show the fix.">Explain and fix an error</button>
                </section>
            </div>
        </section>

        <form class="composer" id="promptForm">
            <label class="sr-only" for="prompt">Prompt</label>
            <textarea id="prompt" placeholder="Ask anything or attach files"></textarea>

            <div class="attachment-row">
                <input id="fileInput" class="sr-only" type="file" accept=".pdf,.txt,.md,.py,.js,.ts,.tsx,.jsx,.html,.css,.json,.csv,.xml,.yaml,.yml,.java,.c,.cpp,.cs,.php,.rb,.go,.rs,.sql,.env" multiple>
                <button id="attachFileBtn" class="ghost-button attachment-button" type="button">+ Attach files</button>
                <div id="fileStatus" class="file-status" hidden></div>
                <button id="removeFileBtn" class="ghost-button remove-file-button" type="button" hidden>Remove</button>
            </div>

            <section id="fileReaderPanel" class="file-reader-panel" hidden>
                <div class="file-reader-header">
                    <div>
                        <div class="file-reader-label">File reader</div>
                        <strong id="fileReaderName" class="file-reader-name">No file selected</strong>
                    </div>
                    <button id="fileReaderToggle" class="ghost-button file-reader-toggle" type="button">Preview</button>
                </div>
                <pre id="fileReaderPreview" class="file-reader-preview" hidden></pre>
            </section>

            <div class="composer-footer">
                <span class="count" id="charCount">0 chars</span>
                <button id="generateBtn" class="primary-button" type="submit" aria-label="Send" aria-busy="false">
                    <span class="button-label">Send</span>
                    <span class="button-spinner" aria-hidden="true"></span>
                    <span class="button-icon">+</span>
                </button>
            </div>
        </form>
    </main>

    <script src="/static/js/app.js?v=20260702-2"></script>
</body>
</html>
